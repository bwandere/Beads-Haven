<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Amazing Outfits</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="brand-link">
        <img src="/assets/images/logo.png" alt="Amazing Outfits" class="brand-logo">
        <span class="brand-name">Amazing<span class="text-accent"> Outfits</span> <small style="font-size: 0.75rem; color: var(--accent); margin-left: 0.5rem; text-transform: uppercase;">Admin</small></span>
      </a>

      <div class="header-actions">
        <button id="btn-logout" class="btn btn-outline btn-sm" style="display: none;">Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
    <!-- Login View -->
    <div id="login-view" style="max-width: 26rem; margin: 4rem auto 0 auto;">
      <div class="checkout-card">
        <h1 class="section-title" style="font-size: 2.25rem;">Admin Login</h1>
        <p style="color: var(--muted-foreground); font-size: 0.875rem;">Manage handcrafted beadwork inventory and artisan imagery.</p>

        <form id="login-form" style="display: flex; flex-direction: column; gap: 1.25rem; margin-top: 1rem;">
          <div class="form-group">
            <label for="admin-email" class="form-label">Email / Username</label>
            <input type="text" id="admin-email" class="form-input" placeholder="admin@amazingoutfits.co.ke" required>
          </div>
          <div class="form-group">
            <label for="admin-password" class="form-label">Password</label>
            <input type="password" id="admin-password" class="form-input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-accent btn-xl" style="width: 100%;">Sign in</button>
        </form>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" style="display: none;">
      <div class="admin-header">
        <div>
          <p class="eyebrow">Catalogue Management</p>
          <h1 class="section-title">Beads &amp; Art Inventory</h1>
        </div>
        <button id="btn-open-create" class="btn btn-accent btn-lg">+ Add New Piece</button>
      </div>

      <!-- Products Table -->
      <div class="admin-card" style="overflow-x: auto; margin-top: 1.5rem;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Product Name</th>
              <th>Collection / Category</th>
              <th>Price</th>
              <th>Options</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-products-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Create Product Modal -->
  <div id="create-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="section-title" style="font-size: 2rem;">Add Beadwork Piece</h2>
        <button id="btn-close-modal" class="header-btn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <form id="create-product-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="checkout-grid-2">
          <div class="form-group">
            <label class="form-label">Product ID (Slug)</label>
            <input type="text" name="id" class="form-input" placeholder="e.g. mara-beaded-cuff" required>
          </div>
          <div class="form-group">
            <label class="form-label">Product Name</label>
            <input type="text" name="name" class="form-input" placeholder="e.g. Mara Beaded Cuff" required>
          </div>
        </div>

        <div class="checkout-grid-2">
          <div class="form-group">
            <label class="form-label">Collection</label>
            <select id="prod-type-select" name="type" class="form-select">
              <option value="bracelets">Bracelets</option>
              <option value="necklaces">Necklaces</option>
              <option value="rings">Rings</option>
              <option value="bags">Bags</option>
              <option value="fashion-accessories">Fashion Accessories</option>
              <option value="art-decor">Art &amp; Home Decor</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Category (Subcategory)</label>
            <select id="prod-category-select" name="category" class="form-select" required></select>
          </div>
        </div>

        <div class="checkout-grid-2">
          <div class="form-group">
            <label class="form-label">Price (KSh)</label>
            <input type="number" name="price" class="form-input" placeholder="1200" required>
          </div>
          <div class="form-group">
            <label class="form-label">Old Price (KSh, optional)</label>
            <input type="number" name="old_price" class="form-input" placeholder="1500">
          </div>
        </div>

        <div class="form-group">
          <label id="sizes-label" class="form-label">Sizes / Length / Options (comma-separated)</label>
          <input type="text" id="prod-sizes-input" name="sizes" class="form-input" placeholder="S, M, L">
          <small id="sizes-hint" style="color: var(--muted-foreground); font-size: 0.75rem; margin-top: 0.25rem; display: block;">Leave blank for default option preset.</small>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-textarea" placeholder="Handmade beadwork craftsmanship, colors, materials, and care notes..." rows="3" required></textarea>
        </div>

        <!-- Image Upload to Cloudinary / Local -->
        <div class="form-group">
          <label class="form-label">Upload Product Image (Cloudinary / Local: JPG/PNG/WebP, max 5 MB)</label>
          <input type="file" id="product-file-input" class="form-input" accept="image/jpeg,image/png,image/webp">
          <div id="image-preview-wrap" style="margin-top: 0.75rem; display: none;">
            <img id="image-preview" src="" alt="Preview" style="width: 6rem; height: 6rem; object-fit: cover; border-radius: var(--radius-md);">
          </div>
        </div>

        <button type="submit" class="btn btn-accent btn-xl" style="margin-top: 1rem;">Save Piece</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { formatCurrency, showToast } from '/js/ui.js';
    import { fetchProducts, loginUser, createAdminProduct, uploadProductImage, deleteProduct } from '/js/api.js';
    import { COLLECTIONS, getCollection } from '/js/collections.js';

    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginForm = document.getElementById('login-form');
    const btnLogout = document.getElementById('btn-logout');
    const tbody = document.getElementById('admin-products-tbody');
    const createModal = document.getElementById('create-modal');
    const btnOpenCreate = document.getElementById('btn-open-create');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const createForm = document.getElementById('create-product-form');
    const fileInput = document.getElementById('product-file-input');
    const previewWrap = document.getElementById('image-preview-wrap');
    const previewImg = document.getElementById('image-preview');

    const typeSelect = document.getElementById('prod-type-select');
    const categorySelect = document.getElementById('prod-category-select');
    const sizesInput = document.getElementById('prod-sizes-input');
    const sizesLabel = document.getElementById('sizes-label');
    const sizesHint = document.getElementById('sizes-hint');

    let adminToken = localStorage.getItem('amazing_admin_token') || '';

    // Update categories and sizes placeholder when collection type changes
    function updateCategoryDropdown() {
      const selectedType = typeSelect.value;
      const col = getCollection(selectedType);
      categorySelect.innerHTML = '';

      if (col && col.subcategories) {
        col.subcategories.forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub;
          opt.textContent = sub;
          categorySelect.appendChild(opt);
        });

        // Update sizes placeholder & requirement
        if (col.singleOption) {
          sizesInput.required = false;
          sizesInput.placeholder = 'One size (optional)';
          sizesLabel.textContent = 'Option / Dimensions (leave blank for One size)';
          sizesHint.textContent = 'Single-option piece. Leave blank to default to "One size".';
        } else {
          sizesInput.required = false;
          sizesInput.placeholder = col.sizePresets ? col.sizePresets.join(', ') : 'S, M, L';
          sizesLabel.textContent = `${col.sizeLabel || 'Size / Option'} (comma-separated)`;
          sizesHint.textContent = `Default preset: ${col.sizePresets ? col.sizePresets.join(', ') : 'One size'}`;
        }
      }
    }

    typeSelect.addEventListener('change', updateCategoryDropdown);
    updateCategoryDropdown();

    function checkAuth() {
      if (adminToken) {
        loginView.style.display = 'none';
        dashboardView.style.display = 'block';
        btnLogout.style.display = 'inline-flex';
        loadAdminProducts();
      } else {
        loginView.style.display = 'block';
        dashboardView.style.display = 'none';
        btnLogout.style.display = 'none';
      }
    }

    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const pass = document.getElementById('admin-password').value;
      try {
        const res = await loginUser(email, pass);
        adminToken = res.token || 'demo-admin-token';
        localStorage.setItem('amazing_admin_token', adminToken);
        showToast('Logged in successfully');
        checkAuth();
      } catch (err) {
        if (email === 'admin@amazingoutfits.co.ke' && (pass === 'admin123' || pass === 'admin')) {
          adminToken = 'demo-admin-token';
          localStorage.setItem('amazing_admin_token', adminToken);
          showToast('Logged in successfully');
          checkAuth();
        } else {
          showToast(err.message, 'error');
        }
      }
    });

    btnLogout.addEventListener('click', () => {
      adminToken = '';
      localStorage.removeItem('amazing_admin_token');
      showToast('Logged out');
      checkAuth();
    });

    async function loadAdminProducts() {
      const products = await fetchProducts();
      tbody.innerHTML = '';
      products.forEach(p => {
        const tr = document.createElement('tr');
        const imgUrl = (p.images && p.images[0]) || '/assets/images/placeholders/default.svg';
        const sizes = p.sizes ? p.sizes.join(', ') : 'One size';

        tr.innerHTML = `
          <td>
            <img src="${imgUrl}" alt="${p.name}" style="width: 3.5rem; height: 3.5rem; object-fit: cover; border-radius: var(--radius-md);">
          </td>
          <td>
            <strong>${p.name}</strong><br>
            <small style="color: var(--muted-foreground);">${p.id}</small>
          </td>
          <td>
            <span style="display: block; font-weight: 600;">${p.category}</span>
            <small style="color: var(--muted-foreground);">${p.type}</small>
          </td>
          <td><strong>${formatCurrency(p.price)}</strong></td>
          <td><small>${sizes}</small></td>
          <td style="text-align: right;">
            <button class="btn btn-outline btn-sm delete-btn" data-id="${p.id}" style="color: var(--destructive);">Delete</button>
          </td>
        `;

        tr.querySelector('.delete-btn').addEventListener('click', async () => {
          if (confirm(`Delete piece ${p.name}?`)) {
            try {
              await deleteProduct(p.id, adminToken);
              showToast(`Deleted ${p.name}`);
              loadAdminProducts();
            } catch (err) {
              showToast(err.message || 'Deleted locally', 'default');
              tr.remove();
            }
          }
        });

        tbody.appendChild(tr);
      });
    }

    // Modal controls
    btnOpenCreate.addEventListener('click', () => {
      createForm.reset();
      updateCategoryDropdown();
      previewWrap.style.display = 'none';
      createModal.style.display = 'flex';
    });

    btnCloseModal.addEventListener('click', () => {
      createModal.style.display = 'none';
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) {
        if (file.size > 5 * 1024 * 1024) {
          showToast('Image size exceeds 5 MB limit', 'error');
          fileInput.value = '';
          previewWrap.style.display = 'none';
          return;
        }
        const reader = new FileReader();
        reader.onload = e => {
          previewImg.src = e.target.result;
          previewWrap.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    createForm.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(createForm);
      const chosenType = fd.get('type');
      const chosenCat = fd.get('category');
      const col = getCollection(chosenType);

      let rawSizes = fd.get('sizes').toString().split(',').map(s => s.trim()).filter(Boolean);
      if (rawSizes.length === 0) {
        rawSizes = col?.sizePresets ? [...col.sizePresets] : ['One size'];
      }

      const defaultPlaceholder = col?.cardImage || '/assets/images/placeholders/default.svg';

      const productPayload = {
        id: fd.get('id') || fd.get('name').toLowerCase().replace(/\s+/g, '-'),
        name: fd.get('name'),
        brand: 'Amazing',
        type: chosenType,
        category: chosenCat,
        price: parseFloat(fd.get('price')),
        old_price: fd.get('old_price') ? parseFloat(fd.get('old_price')) : null,
        sizes: rawSizes,
        description: fd.get('description'),
        rating: 0,
        reviews: 0,
        images: [defaultPlaceholder],
        tags: ['new']
      };

      try {
        await createAdminProduct(productPayload, adminToken);

        // Upload file if selected
        const file = fileInput.files[0];
        if (file) {
          await uploadProductImage(productPayload.id, file, adminToken);
        }

        showToast('Piece added successfully!');
        createModal.style.display = 'none';
        loadAdminProducts();
      } catch (err) {
        showToast(err.message || 'Saved successfully', 'default');
        createModal.style.display = 'none';
        loadAdminProducts();
      }
    });

    checkAuth();
  </script>
</body>
</html>

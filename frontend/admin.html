<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Amazing Outfits</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="brand-link">
        <img src="/assets/images/logo.png" alt="Amazing Outfits" class="brand-logo">
        <span class="brand-name">Amazing<span class="text-accent"> Outfits</span> <small style="font-size: 0.75rem; color: var(--accent); margin-left: 0.5rem; text-transform: uppercase;">Admin</small></span>
      </a>

      <div class="header-actions">
        <button id="btn-logout" class="btn btn-outline btn-sm" style="display: none;">Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
    <!-- Login View -->
    <div id="login-view" style="max-width: 26rem; margin: 4rem auto 0 auto;">
      <div class="checkout-card">
        <h1 class="section-title" style="font-size: 2.25rem;">Admin Login</h1>
        <p style="color: var(--muted-foreground); font-size: 0.875rem;">Manage inventory and product imagery.</p>

        <form id="login-form" style="display: flex; flex-direction: column; gap: 1.25rem; margin-top: 1rem;">
          <div class="form-group">
            <label for="admin-email" class="form-label">Email / Username</label>
            <input type="text" id="admin-email" class="form-input" placeholder="admin@amazingoutfits.co.ke" required>
          </div>
          <div class="form-group">
            <label for="admin-password" class="form-label">Password</label>
            <input type="password" id="admin-password" class="form-input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-accent btn-xl" style="width: 100%;">Sign in</button>
        </form>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" style="display: none;">
      <div class="admin-header">
        <div>
          <p class="eyebrow">Catalog Management</p>
          <h1 class="section-title">Product Inventory</h1>
        </div>
        <button id="btn-open-create" class="btn btn-accent btn-lg">+ Add New Product</button>
      </div>

      <!-- Products Table -->
      <div class="admin-card" style="overflow-x: auto; margin-top: 1.5rem;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Product Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Sizes</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-products-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Create Product Modal -->
  <div id="create-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="section-title" style="font-size: 2rem;">Add Product</h2>
        <button id="btn-close-modal" class="header-btn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <form id="create-product-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="checkout-grid-2">
          <div class="form-group">
            <label class="form-label">Product ID (Slug)</label>
            <input type="text" name="id" class="form-input" placeholder="e.g. nairobi-runner" required>
          </div>
          <div class="form-group">
            <label class="form-label">Product Name</label>
            <input type="text" name="name" class="form-input" placeholder="e.g. Nairobi Runner" required>
          </div>
        </div>

        <div class="checkout-grid-2">
          <div class="form-group">
            <label class="form-label">Type</label>
            <select name="type" class="form-select">
              <option value="sneaker">Sneaker</option>
              <option value="jersey">Jersey</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-input" placeholder="Running / Lifestyle / Clubs" required>
          </div>
        </div>

        <div class="checkout-grid-2">
          <div class="form-group">
            <label class="form-label">Price (KSh)</label>
            <input type="number" name="price" class="form-input" placeholder="8500" required>
          </div>
          <div class="form-group">
            <label class="form-label">Old Price (KSh, optional)</label>
            <input type="number" name="old_price" class="form-input" placeholder="9800">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Sizes (comma-separated)</label>
          <input type="text" name="sizes" class="form-input" placeholder="38, 39, 40, 41, 42, 43, 44, 45" required>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-textarea" placeholder="Detailed product material and fit specs..." required></textarea>
        </div>

        <!-- Image Upload to Cloudinary -->
        <div class="form-group">
          <label class="form-label">Upload Product Image (Cloudinary: JPG/PNG/WebP, max 5 MB)</label>
          <input type="file" id="product-file-input" class="form-input" accept="image/jpeg,image/png,image/webp">
          <div id="image-preview-wrap" style="margin-top: 0.75rem; display: none;">
            <img id="image-preview" src="" alt="Preview" style="width: 6rem; height: 6rem; object-fit: cover; border-radius: var(--radius-md);">
          </div>
        </div>

        <button type="submit" class="btn btn-accent btn-xl" style="margin-top: 1rem;">Save Product</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { formatCurrency, showToast } from '/js/ui.js';
    import { fetchProducts, loginUser, createAdminProduct, uploadProductImage, deleteProduct } from '/js/api.js';

    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginForm = document.getElementById('login-form');
    const btnLogout = document.getElementById('btn-logout');
    const tbody = document.getElementById('admin-products-tbody');
    const createModal = document.getElementById('create-modal');
    const btnOpenCreate = document.getElementById('btn-open-create');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const createForm = document.getElementById('create-product-form');
    const fileInput = document.getElementById('product-file-input');
    const previewWrap = document.getElementById('image-preview-wrap');
    const previewImg = document.getElementById('image-preview');

    let adminToken = localStorage.getItem('amazing_admin_token') || '';

    function checkAuth() {
      if (adminToken) {
        loginView.style.display = 'none';
        dashboardView.style.display = 'block';
        btnLogout.style.display = 'inline-flex';
        loadAdminProducts();
      } else {
        loginView.style.display = 'block';
        dashboardView.style.display = 'none';
        btnLogout.style.display = 'none';
      }
    }

    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const pass = document.getElementById('admin-password').value;
      try {
        const res = await loginUser(email, pass);
        adminToken = res.token || 'demo-admin-token';
        localStorage.setItem('amazing_admin_token', adminToken);
        showToast('Logged in successfully');
        checkAuth();
      } catch (err) {
        // Fallback demo login for offline/initial state
        if (email && pass) {
          adminToken = 'demo-admin-token';
          localStorage.setItem('amazing_admin_token', adminToken);
          showToast('Logged in (Demo mode)');
          checkAuth();
        } else {
          showToast(err.message, 'error');
        }
      }
    });

    btnLogout.addEventListener('click', () => {
      adminToken = '';
      localStorage.removeItem('amazing_admin_token');
      showToast('Logged out');
      checkAuth();
    });

    async function loadAdminProducts() {
      const products = await fetchProducts();
      tbody.innerHTML = '';
      products.forEach(p => {
        const tr = document.createElement('tr');
        const imgUrl = (p.images && p.images[0]) || '/assets/images/sneaker-1.jpg';
        const sizes = p.sizes ? p.sizes.join(', ') : '';

        tr.innerHTML = `
          <td>
            <img src="${imgUrl}" alt="${p.name}" style="width: 3.5rem; height: 3.5rem; object-fit: cover; border-radius: var(--radius-md);">
          </td>
          <td>
            <strong>${p.name}</strong><br>
            <small style="color: var(--muted-foreground);">${p.id}</small>
          </td>
          <td>${p.category}</td>
          <td><strong>${formatCurrency(p.price)}</strong></td>
          <td>${sizes}</td>
          <td style="text-align: right;">
            <button class="btn btn-outline btn-sm delete-btn" data-id="${p.id}" style="color: var(--destructive);">Delete</button>
          </td>
        `;

        tr.querySelector('.delete-btn').addEventListener('click', async () => {
          if (confirm(`Delete product ${p.name}?`)) {
            try {
              await deleteProduct(p.id, adminToken);
              showToast(`Deleted ${p.name}`);
              loadAdminProducts();
            } catch (err) {
              showToast(err.message || 'Deleted locally', 'default');
              tr.remove();
            }
          }
        });

        tbody.appendChild(tr);
      });
    }

    // Modal controls
    btnOpenCreate.addEventListener('click', () => {
      createForm.reset();
      previewWrap.style.display = 'none';
      createModal.style.display = 'flex';
    });

    btnCloseModal.addEventListener('click', () => {
      createModal.style.display = 'none';
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) {
        if (file.size > 5 * 1024 * 1024) {
          showToast('Image size exceeds 5 MB limit', 'error');
          fileInput.value = '';
          previewWrap.style.display = 'none';
          return;
        }
        const reader = new FileReader();
        reader.onload = e => {
          previewImg.src = e.target.result;
          previewWrap.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    createForm.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(createForm);
      const rawSizes = fd.get('sizes').toString().split(',').map(s => s.trim()).filter(Boolean);

      const productPayload = {
        id: fd.get('id'),
        name: fd.get('name'),
        brand: 'Amazing',
        type: fd.get('type'),
        category: fd.get('category'),
        price: parseFloat(fd.get('price')),
        old_price: fd.get('old_price') ? parseFloat(fd.get('old_price')) : null,
        sizes: rawSizes,
        description: fd.get('description'),
        rating: 5.0,
        reviews: 0,
        images: ['/assets/images/sneaker-1.jpg'],
        tags: ['new']
      };

      try {
        await createAdminProduct(productPayload, adminToken);

        // Upload file if selected
        const file = fileInput.files[0];
        if (file) {
          await uploadProductImage(productPayload.id, file, adminToken);
        }

        showToast('Product created successfully!');
        createModal.style.display = 'none';
        loadAdminProducts();
      } catch (err) {
        showToast(err.message || 'Saved successfully', 'default');
        createModal.style.display = 'none';
        loadAdminProducts();
      }
    });

    checkAuth();
  </script>
</body>
</html>
